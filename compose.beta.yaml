# Its own project, image tag and data dir, so beta can run beside production
# without replacing its container, its pridebot:latest image, or its status
# history and generated avatars. (MongoDB is still shared.)
name: pridebot-beta

services:
  bot:
    image: pridebot:beta
    volumes:
      - ./data-beta:/app/data
    environment:
      beta: "true"
    ports:
      - "127.0.0.1:${betaAPIport}:${betaAPIport}"
      - "127.0.0.1:${betaAvatarAPIport}:${betaAvatarAPIport}"
      - "127.0.0.1:${betaProfileAPIport}:${betaProfileAPIport}"
      - "127.0.0.1:${betaPremiumAPIport}:${betaPremiumAPIport}"
      - "127.0.0.1:${betaStatusPort:-2514}:${betaStatusPort:-2514}"
